<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HyperVM Console</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #070b12; color: #e5e7eb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    body { display: grid; place-items: center; padding: 18px; }
    .card { width: min(1200px, 100%); height: min(800px, 94vh); display: flex; flex-direction: column; border: 1px solid #202938; border-radius: 18px; overflow: hidden; background: #0c111a; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px; border-bottom: 1px solid #202938; background: #0a0f17; }
    .title { display:flex; align-items:center; gap: 10px; font-weight: 700; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
    .dot.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .actions { display:flex; gap:8px; align-items:center; }
    button { border: 1px solid #2a3445; background: #111827; color:#e5e7eb; border-radius: 9px; padding: 8px 11px; cursor: pointer; }
    button:hover { background:#182132; }
    #terminal { flex: 1; padding: 10px; min-height: 0; }
    footer { padding: 9px 13px; border-top:1px solid #202938; font-size:12px; color:#9ca3af; display:flex; justify-content:space-between; }
    .login { position:absolute; inset:0; display:grid; place-items:center; background:rgba(7,11,18,.92); backdrop-filter: blur(8px); z-index: 5; }
    .login-box { width:min(420px, calc(100% - 32px)); padding:22px; border:1px solid #283244; border-radius:15px; background:#0c111a; }
    .login-box h1 { margin:0 0 8px; font-size:20px; }
    .login-box p { margin:0 0 16px; color:#9ca3af; font-size:14px; }
    input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid #2a3445; background:#070b12; color:#fff; outline:none; margin-bottom:10px; }
    .error { color:#fca5a5; min-height:20px; font-size:12px; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="title"><span id="dot" class="dot"></span> HyperVM Console <span id="status" style="font-size:12px;color:#9ca3af;font-weight:500">Disconnected</span></div>
      <div class="actions">
        <button id="clear">Clear</button>
        <button id="reconnect">Reconnect</button>
      </div>
    </header>
    <div id="terminal"></div>
    <footer><span>Debian 13 • Browser PTY</span><span id="details">—</span></footer>
  </div>

  <div id="login" class="login">
    <form id="loginForm" class="login-box">
      <h1>Console authentication</h1>
      <p>Enter the <code>CONSOLE_TOKEN</code> configured in your Render service.</p>
      <input id="token" type="password" autocomplete="current-password" placeholder="Console token" required />
      <button type="submit" style="width:100%">Connect to Debian 13</button>
      <div id="error" class="error"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    const terminalEl = document.getElementById('terminal');
    const login = document.getElementById('login');
    const loginForm = document.getElementById('loginForm');
    const tokenEl = document.getElementById('token');
    const errorEl = document.getElementById('error');
    const dot = document.getElementById('dot');
    const status = document.getElementById('status');
    const details = document.getElementById('details');
    const term = new Terminal({ cursorBlink: true, fontSize: 14, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace', convertEol: false, scrollback: 5000, theme: { background: '#080c13' } });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(terminalEl);
    fit.fit();

    let socket = null;
    let token = sessionStorage.getItem('hypervm_console_token') || '';

    function setStatus(online, label) {
      dot.classList.toggle('online', online);
      status.textContent = label;
    }

    function connect() {
      if (!token) { login.style.display = 'grid'; return; }
      if (socket) { try { socket.close(); } catch (_) {} }
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${proto}://${location.host}/ws/terminal`);
      setStatus(false, 'Connecting…');
      socket.onopen = () => {
        fit.fit();
        socket.send(JSON.stringify({ token, type:'auth', rows:term.rows, cols:term.cols }));
      };
      socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'ready') {
          login.style.display = 'none';
          setStatus(true, 'Connected');
          term.write(msg.message || '');
          term.focus();
          details.textContent = 'PTY active';
        } else if (msg.type === 'output') {
          term.write(msg.data || '');
        }
      };
      socket.onclose = (event) => {
        setStatus(false, 'Disconnected');
        details.textContent = event.code === 1008 ? 'Authentication failed' : 'Connection closed';
        if (event.code === 1008) {
          sessionStorage.removeItem('hypervm_console_token');
          token = '';
          errorEl.textContent = 'Invalid token.';
          login.style.display = 'grid';
        }
      };
      socket.onerror = () => setStatus(false, 'Connection error');
    }

    term.onData(data => {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({type:'input', data}));
    });
    window.addEventListener('resize', () => {
      fit.fit();
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({type:'resize', rows:term.rows, cols:term.cols}));
    });
    document.getElementById('clear').onclick = () => term.clear();
    document.getElementById('reconnect').onclick = () => connect();
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      token = tokenEl.value;
      sessionStorage.setItem('hypervm_console_token', token);
      connect();
    });

    fetch('/api/status').then(r=>r.json()).then(s=> {
      details.textContent = `Debian ${s.debian} • ${s.hostname}`;
    }).catch(()=>{});

    if (token) connect(); else login.style.display = 'grid';
  </script>
</body>
</html>
